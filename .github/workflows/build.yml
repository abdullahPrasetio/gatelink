name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]        # pushing a tag like v0.1.0 publishes a Release
  pull_request:
  workflow_dispatch:   # allow manual runs from the Actions tab

jobs:
  # Run the cross-platform unit tests.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install native deps for SkiaSharp (QR decoding)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1
      - name: Test core logic
        env:
          # SkiaSharp needs a usable graphics backend headless.
          DISPLAY: ""
        run: dotnet test tests/GateLink.Core.Tests/GateLink.Core.Tests.csproj -c Release

  # Build the Windows desktop app and publish a self-contained .exe.
  build-windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Compute version from tag
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v',''
          if ([string]::IsNullOrWhiteSpace($v) -or $v -notmatch '^\d+\.\d+\.\d+') { $v = "0.0.0" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building version $v"

      - name: Publish self-contained Windows build
        shell: pwsh
        run: |
          dotnet publish src/GateLink.Desktop/GateLink.Desktop.csproj `
            -c Release -f net9.0-windows10.0.19041.0 -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ steps.ver.outputs.version }} `
            -o publish/win-x64

      - name: Zip the portable Windows build
        shell: pwsh
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath GateLink-windows-x64.zip -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          # Stage the published app as the installer payload.
          New-Item -ItemType Directory -Force -Path installer/windows/payload | Out-Null
          Copy-Item -Recurse -Force publish/win-x64/* installer/windows/payload/
          # Inno Setup is preinstalled on windows-latest runners.
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y; $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer/windows/GateLink.iss

      - name: Upload portable Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: GateLink-windows-x64
          path: GateLink-windows-x64.zip
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: GateLink-windows-setup
          path: installer/windows/output/GateLink-Setup.exe
          if-no-files-found: error

  # Build the macOS app for both CPU architectures. The bundled OpenConnect
  # engine is compiled from pinned sources with -mmacosx-version-min=14.0, so
  # the newer runners (macOS 15/26) do not raise the app's minimum OS.
  build-macos:
    runs-on: ${{ matrix.runner }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            dmg: GateLink-arm64.dmg
            zip: GateLink-arm64.zip
            legacy: true      # keep the old single-arch asset for older apps
          - runner: macos-15-intel
            arch: x64
            dmg: GateLink-x64.dmg
            zip: GateLink-x64.zip
            legacy: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Compute version from tag
        id: ver
        run: |
          v="${{ github.ref_name }}"; v="${v#v}"
          if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then v="0.0.0"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building version $v"
      - name: Install pkg-config if the image does not have it
        run: command -v pkg-config >/dev/null || brew install pkg-config
      - name: Build OpenConnect engine (macOS 14 deployment target)
        env:
          GATELINK_ENGINE_PREFIX: ${{ runner.temp }}/gatelink-engine
        run: ./scripts/build-openconnect-engine.sh
      - name: Bundle OpenConnect into the app
        env:
          GATELINK_ENGINE_PREFIX: ${{ runner.temp }}/gatelink-engine
        run: |
          GATELINK_OPENCONNECT="$GATELINK_ENGINE_PREFIX/sbin/openconnect" \
          GATELINK_EXTRA_PREFIX="$GATELINK_ENGINE_PREFIX" \
          GATELINK_VPNC_SCRIPT="$GATELINK_ENGINE_PREFIX/etc/vpnc/vpnc-script" \
          ./scripts/bundle-openconnect.sh
      - name: Verify bundled openconnect deployment target
        run: |
          MAX=14.0
          fail=0
          for f in src/GateLink.Desktop/Assets/openconnect/openconnect src/GateLink.Desktop/Assets/openconnect/*.dylib; do
            [ -f "$f" ] || continue
            v=$(otool -l "$f" | awk '/LC_BUILD_VERSION/{found=1} found && /minos/{print $2; exit}')
            echo "$f minos=$v"
            if [ -z "$v" ]; then echo "ERROR: cannot read minos for $f"; fail=1; continue; fi
            lower=$(printf '%s\n%s\n' "$v" "$MAX" | sort -t. -k1,1n -k2,2n | head -1)
            if [ "$lower" != "$v" ]; then
              echo "ERROR: $f requires macOS $v, runner target is $MAX"
              fail=1
            fi
          done
          # The engine must load with only system + @loader_path deps.
          if otool -L src/GateLink.Desktop/Assets/openconnect/openconnect \
             | tail -n +2 | awk '{print $1}' \
             | grep -vE '^(@loader_path|/usr/lib|/System)' ; then
            echo "ERROR: unbundled absolute dependency"
            exit 1
          fi
          src/GateLink.Desktop/Assets/openconnect/openconnect --version
          exit $fail

      - name: Build .app bundle
        run: ./scripts/build-macos-app.sh
        env:
          GATELINK_VERSION: ${{ steps.ver.outputs.version }}
      - name: Build drag-to-install DMG
        run: ./scripts/build-macos-dmg.sh
      - name: Name the architecture-specific DMG
        run: cp dist/GateLink.dmg "dist/${{ matrix.dmg }}"
      - name: Sign macOS DMG for auto-update
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GATELINK_RELEASE_KEY: ${{ secrets.GATELINK_RELEASE_KEY }}
        run: |
          if [ -n "${GATELINK_RELEASE_KEY}" ]; then
            printf '%s' "${GATELINK_RELEASE_KEY}" | base64 -D > "$RUNNER_TEMP/gatelink-release.key"
            chmod 600 "$RUNNER_TEMP/gatelink-release.key"
            ./scripts/sign-release.sh "dist/${{ matrix.dmg }}" "$RUNNER_TEMP/gatelink-release.key"
            if [ "${{ matrix.legacy }}" = "true" ]; then
              # Older apps look for the single-arch names; the bytes are identical.
              cp "dist/${{ matrix.dmg }}.sig" dist/GateLink.dmg.sig
              cp "dist/${{ matrix.dmg }}.sha256" dist/GateLink.dmg.sha256
            fi
            rm -f "$RUNNER_TEMP/gatelink-release.key"
          else
            echo "::warning::GATELINK_RELEASE_KEY is not set; auto-update will refuse this release."
          fi
      - name: Zip the app
        run: cd dist && zip -r "${{ matrix.zip }}" GateLink.app
      - name: Upload macOS app (zip)
        uses: actions/upload-artifact@v4
        with:
          name: GateLink-macos-${{ matrix.arch }}
          path: dist/${{ matrix.zip }}
          if-no-files-found: error
      - name: Upload macOS installer (dmg)
        uses: actions/upload-artifact@v4
        with:
          name: GateLink-macos-${{ matrix.arch }}-dmg
          path: dist/${{ matrix.dmg }}
          if-no-files-found: error
      - name: Upload legacy macOS DMG (arm64 only)
        if: matrix.legacy
        uses: actions/upload-artifact@v4
        with:
          name: GateLink-macos-legacy-dmg
          path: dist/GateLink.dmg
          if-no-files-found: error
      - name: Upload macOS signature
        uses: actions/upload-artifact@v4
        with:
          name: GateLink-macos-${{ matrix.arch }}-signature
          path: |
            dist/${{ matrix.dmg }}.sig
            dist/${{ matrix.dmg }}.sha256
          if-no-files-found: ignore
      - name: Upload legacy macOS signature (arm64 only)
        if: matrix.legacy
        uses: actions/upload-artifact@v4
        with:
          name: GateLink-macos-legacy-signature
          path: |
            dist/GateLink.dmg.sig
            dist/GateLink.dmg.sha256
          if-no-files-found: ignore

  # When a version tag (v*) is pushed, collect both builds into a GitHub Release.
  release:
    runs-on: ubuntu-latest
    needs: [ build-windows, build-macos ]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/GateLink-windows-setup/GateLink-Setup.exe
            artifacts/GateLink-windows-x64/GateLink-windows-x64.zip
            artifacts/GateLink-macos-arm64-dmg/GateLink-arm64.dmg
            artifacts/GateLink-macos-x64-dmg/GateLink-x64.dmg
            artifacts/GateLink-macos-legacy-dmg/GateLink.dmg
            artifacts/GateLink-macos-arm64/GateLink-arm64.zip
            artifacts/GateLink-macos-x64/GateLink-x64.zip
            artifacts/GateLink-macos-arm64-signature/GateLink-arm64.dmg.sig
            artifacts/GateLink-macos-arm64-signature/GateLink-arm64.dmg.sha256
            artifacts/GateLink-macos-x64-signature/GateLink-x64.dmg.sig
            artifacts/GateLink-macos-x64-signature/GateLink-x64.dmg.sha256
            artifacts/GateLink-macos-legacy-signature/GateLink.dmg.sig
            artifacts/GateLink-macos-legacy-signature/GateLink.dmg.sha256
          fail_on_unmatched_files: false
          generate_release_notes: true
